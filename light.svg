<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Professional developer profile">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .ascii {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 11px;
                line-height: 11px;
                fill: #2563EB;
                letter-spacing: 1px;
                white-space: pre;
            }
            .text-main {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                fill: #0F172A;
            }
            .text-muted {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                fill: #475569;
            }
            .text-accent {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                fill: #06B6D4;
            }
            .glass {
                fill: rgba(241, 245, 249, 0.4);
                stroke: rgba(0, 0, 0, 0.1);
                stroke-width: 1;
            }
        </style>
    </defs>
    
    <rect width="1180" height="610" rx="24" fill="url(#bgGrad)" />
    
    <!-- Top terminal bar -->
    <g transform="translate(30, 20)">
        <circle cx="10" cy="15" r="6" fill="#FF5F56" />
        <circle cx="30" cy="15" r="6" fill="#FFBD2E" />
        <circle cx="50" cy="15" r="6" fill="#27C93F" />
        <text x="75" y="20" class="text-muted" font-size="14">hmpmanish@developer:~ [ ONLINE ]</text>
    </g>

