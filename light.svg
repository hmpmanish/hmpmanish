        <text y="460" class="text-accent" font-size="14">~/profile $ ./build --ship<animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></text>
    </g>
    
    <!-- RIGHT PANEL: SYSTEM.INFO -->
